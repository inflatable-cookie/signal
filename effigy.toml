[catalog]
alias = "signal"

[manifest]
minimum_effigy_version = "0.7.0"
include = [
  "docs/effigy.tasks.docs.toml",
  "demos/effigy.demos.toml",
  "config/release.toml",
]

[bootstrap]
setup = ["bootstrap:deps"]

[test.suites]
compile = "cargo test --workspace --no-run"
nextest = "CARGO_TARGET_DIR=/tmp/signal-nextest-target cargo nextest run --workspace"

[tasks]
"bootstrap:deps" = "cargo fetch"
health = [{ task = "build" }]
validate = [
  { task = "health" },
  { task = "fmt" },
  { task = "test compile" },
  { task = "check:docs" },
]
qa = [
  { task = "validate" },
  { task = "qa:docs" },
]
build = "cargo build --workspace"
"check:docs" = "RUSTFLAGS='-D missing-docs' cargo check --workspace --lib"
fmt = "cargo fmt --all -- --check"
# Wall-clock soak lane. Single-threaded on purpose: these tests assert
# sustained real-time throughput, and running them beside the rest of the
# suite creates the contention that makes them fail. Local only -- shared CI
# runners cannot support a throughput claim.
"test:soak" = "SIGNAL_SOAK_TESTS=1 nice -n 5 cargo test -p signal-hardware -p signal-plugin-bridge -p signal-render-plane -- --test-threads=1"
lint = "nice -n 5 cargo clippy --workspace --all-targets --all-features --jobs $(( $(sysctl -n hw.ncpu) - 2 )) -- -D warnings"
"lint:no-features" = "nice -n 5 cargo clippy --workspace --all-targets --no-default-features --jobs $(( $(sysctl -n hw.ncpu) - 2 )) -- -D warnings"
# No `dev` task: signal-host-local is a library (its binary died in g10.005).
# Use the runnable examples instead:
#   cargo run -p signal-hardware-cpal --example tone
#   cargo run -p signal-render-plane --example render_soak
