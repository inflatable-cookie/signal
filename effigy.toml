[catalog]
alias = "signal"

[tasks]
health = [{ task = "build" }]
validate = [
  { task = "health" },
  { task = "test" },
]
qa = [
  { task = "validate" },
  { task = "qa:docs" },
]
"qa:docs:links" = "effigy docs check-links"
"qa:docs:agent-defaults" = "effigy docs check-forbidden AGENTS.md README.md docs/README.md --forbid '--repo .'"
"qa:docs:headings" = "effigy docs check-headings docs/README.md docs/vision/README.md docs/roadmaps/README.md docs/logs/README.md --require-heading '## Next Task'"
"qa:docs:index:vision" = "effigy docs check-index --policy-index vision"
"qa:docs:next-action:vision" = "effigy docs check-next-action --policy vision"
"qa:northstar" = [
  { task = "qa:docs:headings" },
  { task = "qa:docs:index:vision" },
  { task = "qa:docs:next-action:vision" },
]
"qa:docs" = [
  { task = "qa:docs:links" },
  { task = "qa:docs:agent-defaults" },
  { task = "qa:northstar" },
]
"acceptance:analysis" = [
  { run = "cargo test -p signal-analysis harness -- --nocapture" },
  { run = "cargo test -p signal-analysis-rhythm harness -- --nocapture" },
  { run = "cargo test -p signal-analysis-tonal harness -- --nocapture" },
  { run = "cargo test -p signal-analysis-character harness -- --nocapture" },
  { run = "cargo test -p signal-analysis-loudness harness -- --nocapture" },
  { run = "cargo test -p signal-analysis-embed harness -- --nocapture" },
]
"acceptance:conformance" = [
  { run = "cargo test -p signal-runtime public_runtime_contract_boundary_is_consumable_from_reexports" },
  { run = "cargo test -p signal-supervisor-tools export_json_carries_runtime_owned_plugin_discovery_catalog" },
  { task = "acceptance:plugin-backend-breadth" },
  { task = "acceptance:host-edge-consumer" },
  { run = "cargo test -p signal-supervisor-tools conformance_matrix_json_reports_runnable_consumer_boundary" },
  { run = "cargo run -p signal-runtime --example supervisor_report_demo" },
  { run = "cargo run -p signal-supervisor-tools -- --describe-conformance-matrix --format=json" },
]
"acceptance:plugin-backend-breadth" = [
  { run = "cargo test -p signal-runtime public_runtime_plugin_discovery_coverage_is_consumable_from_reexports" },
  { run = "cargo test -p signal-supervisor-tools export_json_carries_runtime_owned_plugin_discovery_capability_coverage" },
]
"acceptance:host-edge-boundary" = [
  { run = "cargo test -p signal-supervisor-tools host_edge_boundary_json_reports_stable_and_unstable_edges" },
  { run = "cargo run -p signal-supervisor-tools -- --describe-host-edge-boundary --format=json" },
]
"acceptance:host-edge-consumer" = [
  { task = "acceptance:host-edge-boundary" },
  { run = "cargo test -p signal-host-local local_shared_host_edge_is_consumable_without_private_helpers" },
  { run = "cargo test -p signal-host-server server_shared_host_edge_is_consumable_without_private_helpers" },
]
"acceptance:interruption-boundary" = [
  { run = "cargo test -p signal-runtime public_runtime_interruption_boundary_reports_restartable_runtime_state" },
  { run = "cargo test -p signal-runtime public_runtime_interruption_boundary_reports_resumable_deferred_state" },
  { run = "cargo test -p signal-host-local local_shared_host_edge_is_consumable_without_private_helpers" },
  { run = "cargo test -p signal-host-server server_shared_host_edge_is_consumable_without_private_helpers" },
  { run = "cargo test -p signal-supervisor-tools interruption_boundary_json_reports_runtime_and_host_edge_proofs" },
  { run = "cargo run -p signal-supervisor-tools -- --describe-interruption-boundary --format=json" },
]
"acceptance:fault-diagnostic-boundary" = [
  { run = "cargo test -p signal-runtime public_runtime_fault_diagnostic_boundary_reports_canonical_runtime_receipts" },
  { run = "cargo test -p signal-host-local local_shared_host_edge_exports_runtime_fault_diagnostic_truth" },
  { run = "cargo test -p signal-host-server server_shared_host_edge_exports_runtime_fault_diagnostic_truth" },
  { run = "cargo test -p signal-supervisor-tools fault_diagnostic_boundary_json_reports_runtime_and_host_edge_proofs" },
  { run = "cargo run -p signal-supervisor-tools -- --describe-fault-diagnostic-boundary --format=json" },
]
"acceptance:block-timing-boundary" = [
  { run = "cargo test -p signal-runtime public_runtime_block_timing_boundary_reports_bounded_runtime_measurements" },
  { run = "cargo test -p signal-host-local local_shared_host_edge_exports_runtime_block_timing_truth" },
  { run = "cargo test -p signal-host-server server_shared_host_edge_exports_runtime_block_timing_truth" },
  { run = "cargo test -p signal-supervisor-tools block_timing_boundary_json_reports_runtime_and_host_edge_proofs" },
  { run = "cargo run -p signal-supervisor-tools -- --describe-block-timing-boundary --format=json" },
]
"acceptance:critical-path-boundary" = [
  { run = "cargo test -p signal-runtime public_runtime_critical_path_boundary_reports_bounded_hotspot_receipts" },
  { run = "cargo test -p signal-host-local local_shared_host_edge_exports_runtime_critical_path_truth" },
  { run = "cargo test -p signal-host-server server_shared_host_edge_exports_runtime_critical_path_truth" },
  { run = "cargo test -p signal-supervisor-tools critical_path_boundary_json_reports_runtime_and_host_edge_proofs" },
  { run = "cargo run -p signal-supervisor-tools -- --describe-critical-path-boundary --format=json" },
]
"acceptance:recording-continuity" = [
  { run = "cargo test -p signal-runtime runtime_recording_capture_resumes_same_identity_after_safe_mode_clears" },
  { run = "cargo test -p signal-runtime runtime_recording_capture_preserves_restartable_checkpoint_across_stop_and_reconfigure" },
  { run = "cargo test -p signal-runtime runtime_recording_capture_reports_terminal_checkpoint_on_commit_failure" },
  { run = "cargo test -p signal-runtime public_runtime_recording_continuity_boundary_reports_resumable_restartable_and_terminal_states" },
  { run = "cargo test -p signal-host-local local_shared_host_edge_exports_resumable_recording_checkpoint_truth" },
  { run = "cargo test -p signal-host-server server_shared_host_edge_exports_restartable_and_terminal_recording_checkpoint_truth" },
  { run = "cargo test -p signal-supervisor-tools recording_continuity_boundary_json_reports_runtime_and_host_edge_proofs" },
  { run = "cargo run -p signal-supervisor-tools -- --describe-recording-continuity-boundary --format=json" },
]
"acceptance:offline-render-continuity" = [
  { run = "cargo test -p signal-runtime runtime_offline_render_session_snapshot_preserves_checkpoint_through_pause_and_recoverable_states" },
  { run = "cargo test -p signal-runtime runtime_offline_render_session_snapshot_reports_restartable_state_across_stop_restart_and_resume" },
  { run = "cargo test -p signal-runtime runtime_offline_render_session_snapshot_reports_failed_terminal_state_on_delivery_error" },
  { run = "cargo test -p signal-runtime public_runtime_offline_render_continuity_boundary_reports_resumable_restartable_and_terminal_states" },
  { run = "cargo test -p signal-host-local local_shared_host_edge_exports_resumable_offline_render_session_truth" },
  { run = "cargo test -p signal-host-server server_shared_host_edge_exports_restartable_and_terminal_offline_render_session_truth" },
  { run = "cargo test -p signal-supervisor-tools offline_render_continuity_boundary_json_reports_runtime_and_host_edge_proofs" },
  { run = "cargo run -p signal-supervisor-tools -- --describe-offline-render-continuity-boundary --format=json" },
]
"acceptance:plugin-continuity" = [
  { run = "cargo test -p signal-runtime runtime_shared_sandbox_blast_radius_stays_boundary_local_across_recovery_and_terminal_states" },
  { run = "cargo test -p signal-runtime runtime_plugin_placement_policy_exports_allowlist_denylist_and_by_format_receipts" },
  { run = "cargo test -p signal-runtime public_runtime_plugin_continuity_boundary_reports_shared_boundary_and_policy_truth" },
  { run = "cargo test -p signal-host-local local_shared_host_edge_exports_plugin_placement_and_shared_boundary_continuity_truth" },
  { run = "cargo test -p signal-host-server server_shared_host_edge_exports_plugin_placement_and_shared_boundary_continuity_truth" },
  { run = "cargo test -p signal-supervisor-tools plugin_continuity_boundary_json_reports_runtime_and_host_edge_proofs" },
  { run = "cargo run -p signal-supervisor-tools -- --describe-plugin-continuity-boundary --format=json" },
]
"acceptance:release-boundary" = [
  { task = "acceptance:conformance" },
  { run = "cargo test -p signal-supervisor-tools release_boundary_json_reports_packaging_baseline" },
  { run = "cargo run -p signal-supervisor-tools -- --describe-release-boundary --format=json" },
]
"acceptance:packaging-manifest" = [
  { task = "acceptance:release-boundary" },
  { run = "cargo test -p signal-supervisor-tools packaging_manifest_json_reports_release_bundle_and_receipts" },
  { run = "cargo run -p signal-supervisor-tools -- --describe-packaging-manifest --format=json" },
]
"acceptance:release-packaging-consumer" = [
  { task = "acceptance:packaging-manifest" },
  { run = "cargo test -p signal-supervisor-tools --test public_packaging_manifest_boundary public_release_packaging_boundary_is_consumable_without_private_scripts" },
]
"acceptance:downstream-release" = [
  { task = "acceptance:release-packaging-consumer" },
  { run = "cargo test -p signal-supervisor-tools downstream_automation_json_reports_mandatory_and_optional_fixtures" },
  { run = "cargo run -p signal-supervisor-tools -- --describe-downstream-automation --format=json" },
]
"acceptance:downstream-depth" = [
  { run = "cargo run -p signal-supervisor-tools -- --format=json local mixed" },
  { run = "cargo run -p signal-supervisor-tools -- --format=json local soak" },
]
"acceptance:downstream-automation" = [
  { task = "acceptance:downstream-release" },
  { task = "acceptance:downstream-depth" },
]
"acceptance:downstream-gate" = [
  { task = "acceptance:downstream-release" },
  { run = "cargo test -p signal-supervisor-tools downstream_fail_gates_json_reports_required_and_deferred_policy" },
  { run = "cargo run -p signal-supervisor-tools -- --describe-downstream-fail-gates --format=json" },
]
"acceptance:g05-closeout" = [
  { task = "acceptance:downstream-gate" },
  { run = "cargo test -p signal-supervisor-tools generation_closeout_json_reports_combined_boundary_and_next_queue" },
  { run = "cargo run -p signal-supervisor-tools -- --describe-generation-closeout --format=json" },
]
build = [
  { task = "configure:debug" },
  { task = "compile:debug" },
]
dev = [
  { task = "build" },
  { run = "./legacy/cpp/build/src/loophole-signal {args}" },
]
test = [
  { task = "build" },
  { run = "ctest --test-dir legacy/cpp/build --output-on-failure {args}" },
]
"configure:debug" = "cmake -S legacy/cpp -B legacy/cpp/build"
"compile:debug" = "cmake --build legacy/cpp/build --config Debug"
"audit:god-files" = "python3 ../chorus/meta/tools/check_god_file_audit.py --workspace-root .. --fail-on high"

[docs_policy.indexes.vision]
file = "docs/vision/README.md"
dir = "docs/vision"
section = "Vision Artifacts"

[docs_policy.next_actions.vision]
index = "vision"
heading = "## Next Task"
allowlist_file = "docs/policy/vision-next-task-verbs.txt"
