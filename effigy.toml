[catalog]
alias = "signal"

[tasks]
health = [{ task = "build" }]
validate = [
  { task = "health" },
  { task = "test" },
]
qa = [{ task = "validate" }]
build = [
  { task = "configure:debug" },
  { task = "compile:debug" },
]
dev = [
  { task = "build" },
  { run = "./legacy/cpp/build/src/loophole-signal {args}" },
]
test = [
  { task = "build" },
  { run = "ctest --test-dir legacy/cpp/build --output-on-failure {args}" },
]
"configure:debug" = "cmake -S legacy/cpp -B legacy/cpp/build"
"compile:debug" = "cmake --build legacy/cpp/build --config Debug"
"audit:god-files" = "python3 ../chorus/meta/tools/check_god_file_audit.py --workspace-root .. --fail-on high"
