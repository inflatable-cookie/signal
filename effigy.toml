[catalog]
alias = "signal"

[bootstrap]
setup = ["bootstrap:deps"]

[tasks]
"bootstrap:deps" = "cargo fetch"
health = [{ task = "build" }]
validate = [
  { task = "health" },
  { task = "test" },
]
qa = [
  { task = "validate" },
  { task = "qa:docs" },
]
"qa:docs:links" = "effigy docs check-links"
"qa:docs:agent-defaults" = "effigy docs check-forbidden AGENTS.md README.md docs/README.md --forbid '--repo .'"
"qa:docs:headings" = "effigy docs check-headings docs/README.md docs/vision/README.md docs/roadmaps/README.md docs/logs/README.md --require-heading '## Next Task'"
"qa:docs:index:vision" = "effigy docs check-index --policy-index vision"
"qa:docs:next-action:vision" = "effigy docs check-next-action --policy vision"
"qa:northstar" = [
  { task = "qa:docs:headings" },
  { task = "qa:docs:index:vision" },
  { task = "qa:docs:next-action:vision" },
]
"demo:program-shape" = [
  { run = "python3 -m json.tool demos/manifest.schema.json > /dev/null" },
  { run = "python3 -m json.tool demos/templates/demo-manifest.example.json > /dev/null" },
]
"demo:conventions" = [
  { task = "demo:program-shape" },
  { run = "python3 -m json.tool demos/templates/demo-receipt.example.json > /dev/null" },
]
"demo:coverage-matrix" = [
  { task = "demo:conventions" },
  { run = "python3 -m json.tool demos/coverage-matrix.json > /dev/null" },
]
"demo:sandbox-lifecycle" = [
  { task = "demo:coverage-matrix" },
  { run = "python3 -m json.tool demos/manifests/plugin-sandbox-lifecycle.demo.json > /dev/null" },
  { run = "python3 demos/scripts/run_sandbox_lifecycle_demo.py" },
  { run = "python3 -m json.tool demos/receipts/plugin-sandbox-lifecycle.receipt.json > /dev/null" },
]
"demo:runtime-recovery-inspector" = [
  { task = "demo:coverage-matrix" },
  { run = "python3 -m json.tool demos/manifests/runtime-recovery-inspector.demo.json > /dev/null" },
  { run = "python3 demos/scripts/run_runtime_recovery_inspector_demo.py" },
  { run = "python3 -m json.tool demos/receipts/runtime-recovery-inspector.receipt.json > /dev/null" },
]
"qa:docs" = [
  { task = "qa:docs:links" },
  { task = "qa:docs:agent-defaults" },
  { task = "qa:northstar" },
]
"acceptance:analysis" = [
  { run = "cargo test -p signal-analysis harness -- --nocapture" },
  { run = "cargo test -p signal-analysis-rhythm harness -- --nocapture" },
  { run = "cargo test -p signal-analysis-tonal harness -- --nocapture" },
  { run = "cargo test -p signal-analysis-character harness -- --nocapture" },
  { run = "cargo test -p signal-analysis-loudness harness -- --nocapture" },
  { run = "cargo test -p signal-analysis-embed harness -- --nocapture" },
]
"acceptance:conformance" = [
  { run = "cargo test -p signal-runtime public_runtime_contract_boundary_is_consumable_from_reexports" },
  { run = "cargo test -p signal-supervisor-tools export_json_carries_runtime_owned_plugin_discovery_catalog" },
  { task = "acceptance:plugin-backend-breadth" },
  { task = "acceptance:host-edge-consumer" },
  { run = "cargo test -p signal-supervisor-tools conformance_matrix_json_reports_runnable_consumer_boundary" },
  { run = "cargo run -p signal-runtime --example supervisor_report_demo" },
  { run = "cargo run -p signal-supervisor-tools -- --describe-conformance-matrix --format=json" },
]
"acceptance:plugin-backend-breadth" = [
  { run = "cargo test -p signal-runtime public_runtime_plugin_discovery_coverage_is_consumable_from_reexports" },
  { run = "cargo test -p signal-supervisor-tools export_json_carries_runtime_owned_plugin_discovery_capability_coverage" },
]
"acceptance:host-edge-boundary" = [
  { run = "cargo test -p signal-supervisor-tools host_edge_boundary_json_reports_stable_and_unstable_edges" },
  { run = "cargo run -p signal-supervisor-tools -- --describe-host-edge-boundary --format=json" },
]
"acceptance:host-edge-consumer" = [
  { task = "acceptance:host-edge-boundary" },
  { run = "cargo test -p signal-host-local local_shared_host_edge_is_consumable_without_private_helpers" },
