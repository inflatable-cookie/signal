[catalog]
alias = "signal"

[manifest]
include = [
  "docs/effigy.tasks.docs.toml",
  "tests/effigy.tasks.acceptance.boundaries.toml",
  "tests/effigy.tasks.acceptance.lanes.toml",
  "demos/effigy.demos.toml",
]

[bootstrap]
setup = ["bootstrap:deps"]

[test.suites]
compile = "cargo test --workspace --no-run"
nextest = "CARGO_TARGET_DIR=/tmp/signal-nextest-target cargo nextest run --workspace"

[tasks]
"bootstrap:deps" = "cargo fetch"
health = [{ task = "build" }]
validate = [
  { task = "health" },
  { task = "test compile" },
]
qa = [
  { task = "validate" },
  { task = "qa:docs" },
]
build = "cargo build --workspace"
dev = [
  { task = "build" },
  { run = "cargo run -p signal-host-local -- {args}" },
]
