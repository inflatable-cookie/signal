[package]
name = "signal-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Embeddable runtime orchestration and diagnostics surfaces for Signal."

[dependencies]
hound = "3.5"
signal-analysis = { path = "../signal-analysis" }
signal-analysis-character = { path = "../signal-analysis-character" }
signal-analysis-loudness = { path = "../signal-analysis-loudness" }
signal-graph = { path = "../signal-graph" }
signal-hardware = { path = "../signal-hardware" }
signal-plugin = { path = "../signal-plugin" }
signal-primitives = { path = "../signal-primitives" }
symphonia = { version = "0.5", features = ["aiff", "aac", "alac", "isomp4", "mp3", "flac", "ogg", "vorbis"] }
