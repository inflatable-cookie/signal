[package]
name = "signal-host-local"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Local desktop runtime host assembly for Signal."

[dependencies]
signal-hardware = { path = "../signal-hardware" }
signal-hardware-output-cpal = { path = "../signal-hardware-output-cpal" }
signal-graph = { path = "../signal-graph" }
signal-ipc = { path = "../signal-ipc" }
signal-plugin = { path = "../signal-plugin" }
signal-plugin-clap = { path = "../signal-plugin-clap" }
signal-plugin-au = { path = "../signal-plugin-au" }
signal-plugin-vst3 = { path = "../signal-plugin-vst3" }
signal-primitives = { path = "../signal-primitives" }
signal-runtime = { path = "../signal-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hound = "3.5"