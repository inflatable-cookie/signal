signal-ipc = { path = "../signal-ipc" }
signal-plugin = { path = "../signal-plugin" }
signal-plugin-clap = { path = "../signal-plugin-clap" }
signal-plugin-au = { path = "../signal-plugin-au" }
signal-plugin-lv2 = { path = "../signal-plugin-lv2" }
signal-plugin-vst3 = { path = "../signal-plugin-vst3" }
signal-primitives = { path = "../signal-primitives" }
signal-runtime = { path = "../signal-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
