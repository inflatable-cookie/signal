[tasks]
"demo:program-shape" = [
  { run = "python3 -m json.tool demos/manifest.schema.json > /dev/null" },
  { run = "python3 -m json.tool demos/templates/demo-manifest.example.json > /dev/null" },
]
"demo:conventions" = [
  { task = "demo:program-shape" },
  { run = "python3 -m json.tool demos/templates/demo-receipt.example.json > /dev/null" },
]
"demo:coverage-matrix" = [
  { task = "demo:conventions" },
  { run = "python3 -m json.tool demos/coverage-matrix.json > /dev/null" },
]

[demos.plugin-sandbox-lifecycle]
title = "Signal Sandbox Lifecycle Demo"
summary = "Exercises the sandbox broker lifecycle, timeout recovery, and shutdown proof through the existing repo-owned task."
proof = "Operator-visible proof that sandbox lifecycle state, timeout cleanup, and rendered evidence stay inspectable through Effigy's demo surface."
owner = "signal"
mode = "headless"
status = "ready"
covers = ["signal-plugin-sandbox", "signal-ipc"]
tags = ["plugin", "sandbox", "lifecycle"]
run = [
  { task = "demo:coverage-matrix" },
  { run = "python3 -m json.tool demos/manifests/plugin-sandbox-lifecycle.demo.json > /dev/null" },
  { run = "python3 demos/scripts/run_sandbox_lifecycle_demo.py" },
  { run = "python3 -m json.tool demos/receipts/plugin-sandbox-lifecycle.receipt.json > /dev/null" },
]
receipt = "demos/receipts/plugin-sandbox-lifecycle.receipt.json"
artifacts = [
  "demos/receipts/plugin-sandbox-lifecycle.view.html",
  "demos/scenarios/plugin-sandbox-lifecycle.default.md",
]

