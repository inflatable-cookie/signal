# Interactive demo tasks. This was a `[demos.*]` entry until Effigy v0.15 removed
# the demo registry; the run steps below are unchanged.

# Signal Plugin Capability Browser: launches the bounded interactive plugin browser
# and keeps the official proof receipt and operator notes attached to one entry
# (interactive; covers signal-plugin, signal-plugin-clap, signal-plugin-vst3,
# signal-plugin-au, signal-plugin-lv2, signal-host-local).
# Receipt: demos/receipts/plugin-capability-browser.receipt.json
# Artifacts: demos/scenarios/plugin-capability-browser.default.md
[tasks."demo:plugin-capability-browser"]
run = [
  { run = "bun -e \"await Bun.file('demos/manifest.schema.json').json()\"" },
  { run = "bun -e \"await Bun.file('demos/templates/demo-manifest.example.json').json()\"" },
  { run = "bun -e \"await Bun.file('demos/templates/demo-receipt.example.json').json()\"" },
  { run = "bun -e \"await Bun.file('demos/coverage-matrix.json').json()\"" },
  { run = "bun -e \"await Bun.file('demos/manifests/plugin-capability-browser.demo.json').json()\"" },
  { run = "bun run demos/scripts/run_plugin_capability_browser_demo.ts" },
  { run = "bun -e \"await Bun.file('demos/receipts/plugin-capability-browser.receipt.json').json()\"" },
  { run = "bun run demos/scripts/run_plugin_capability_browser_demo.ts --scan-mode system --serve" },
]
