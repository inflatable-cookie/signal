[demos.macos-au-coreaudio-boundary]
title = "Signal macOS AU CoreAudio Boundary Demo"
summary = "Runs the existing macOS-specific AU and CoreAudio proof lane through one dedicated demo entry."
proof = "Operator-visible proof that the macOS AU/CoreAudio boundary is queryable and reviewable through Effigy's demo registry."
owner = "signal"
mode = "headless"
status = "ready"
covers = ["signal-plugin-au", "signal-host-local"]
tags = ["hardware", "macos", "au", "coreaudio"]
run = [
  { run = "bun -e \"await Bun.file('demos/manifest.schema.json').json()\"" },
  { run = "bun -e \"await Bun.file('demos/templates/demo-manifest.example.json').json()\"" },
  { run = "bun -e \"await Bun.file('demos/templates/demo-receipt.example.json').json()\"" },
  { run = "bun -e \"await Bun.file('demos/coverage-matrix.json').json()\"" },
  { run = "bun -e \"await Bun.file('demos/manifests/macos-au-coreaudio-boundary.demo.json').json()\"" },
  { run = "bun run demos/scripts/run_macos_au_coreaudio_boundary_demo.ts" },
  { run = "bun -e \"await Bun.file('demos/receipts/macos-au-coreaudio-boundary.receipt.json').json()\"" },
]
receipt = "demos/receipts/macos-au-coreaudio-boundary.receipt.json"
artifacts = [
  "demos/receipts/macos-au-coreaudio-boundary.view.html",
  "demos/scenarios/macos-au-coreaudio-boundary.default.md",
]

