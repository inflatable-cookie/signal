# Release configuration for the Signal workspace.
#
# The repository root is a virtual Cargo workspace: it has no `[package]`, so
# effigy's default version probe (which resolves `workspace.package.version`
# only via a root `package.version.workspace = true`) cannot find the version.
# The field is therefore named explicitly.
[release]
version-file = "Cargo.toml"
version-path = "workspace.package.version"
changelog = "CHANGELOG.md"
# Cargo.lock is deliberately NOT a sync-file. Effigy syncs it with
# `cargo generate-lockfile`, which rebuilds the lockfile from scratch and
# resolves every dependency to its newest compatible version -- on the 0.1.0
# prepare that silently bumped ~40 crates including syn 2 -> 3 and rustix
# 0.38 -> 0.41. Worse, sync-files run *after* the gates, so those upgrades
# would have entered the release commit untested. The lockfile is instead
# updated with `cargo update -w`, which touches only workspace member
# versions, and the release notes record it.
tag-format = "v{version}"

# Gates run before a release is prepared or executed.
#
# The heavy gates are throttled so the machine stays usable while they run:
# `nice -n 5`, two cores left free for the build, four for the test run.
# Unthrottled they saturate every core for minutes at a time. This is a light
# touch on purpose -- the first attempt used `nice -n 10` and only 14 of 18
# cores, which left obvious headroom unused and made the gates slower than they
# needed to be. CI is unthrottled: a runner has nothing else to do.
#
# `lint` denies warnings. The workspace's 14 known warnings were cleared for
# the 0.1.0 tag, so the gate now blocks on any new one. It runs twice because
# `--all-features` alone cannot see cfg-gated code that only compiles when a
# feature is off — a mis-gated item stays invisible until the no-feature build.
[release.gates]
fmt = "cargo fmt --all -- --check"
lint = "nice -n 5 cargo clippy --workspace --all-targets --all-features --jobs $(( $(sysctl -n hw.ncpu) - 2 )) -- -D warnings"
"lint:no-features" = "nice -n 5 cargo clippy --workspace --all-targets --no-default-features --jobs $(( $(sysctl -n hw.ncpu) - 2 )) -- -D warnings"
test = "nice -n 5 cargo test --workspace --jobs $(( $(sysctl -n hw.ncpu) - 2 )) -- --test-threads=$(( $(sysctl -n hw.ncpu) - 4 ))"
# The wall-clock soak lane, which the default suite deliberately skips. Runs
# single-threaded and takes about 40s. Local only: it asserts sustained
# real-time throughput, which no shared CI runner can honour, so CI skips it
# and the release gate is the only place the claim gets made.
soak = "effigy test:soak"
# The two gates proven by swallowtail v0.1.1, in the single-toolchain shape
# longhorn adopted. Neither can run in CI: `floor` needs a second rustup
# toolchain installed beside the pinned one, and `source-consumer` builds a
# throwaway crate against a git source of this very tree.
#
# `floor` runs clippy AND the full suite at the MSRV, not `cargo check`.
# Longhorn's floor violation appeared only under `--all-targets` -- a
# dev-dependency pulled the feature that compiled the offending build script --
# and a bare check passed and gave false confidence. On signal's first run it
# immediately found a real one: 1.95's clippy denies a `collapsible_match` that
# 1.97.1 does not.
#
# `source-consumer` is the gate for the failure mode that path-based
# co-development hides: every sibling checkout is present locally, so a manifest
# that only resolves because of them looks correct until a consumer without them
# tries the tag.
floor = "effigy release:floor"
"source-consumer" = "effigy release:source-consumer"
validate = "effigy validate"
docs = "effigy qa:docs"
