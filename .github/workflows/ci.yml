name: CI

# Deliberately not on every push to main. This job builds the whole workspace
# twice under clippy plus a full test run, on macos-latest, which GitHub bills
# at ten times the Linux rate. It runs when the answer is actually wanted:
#
#   workflow_dispatch  - before cutting a release, or on demand
#   push: tags v*      - the tagged commit itself
#   pull_request       - before merging
#
# The release flow is therefore: commit to main, dispatch this workflow, wait
# for green, then tag. macOS is not negotiable for the runner: the AU and VST3
# host adapters and the CoreAudio hardware layer only build there.
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # Wall-clock soak tests assert sustained real-time throughput, which a shared
  # runner cannot deliver. They self-skip unless this is "1". Run them locally
  # with `effigy test:soak`.
  SIGNAL_SOAK_TESTS: "0"

jobs:
  check:
    name: Build, test, lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel and the components, so the first
      # cargo invocation installs them. Do not re-declare them here: the two
      # would drift, and the previous inline form (`--component rustfmt clippy`)
      # silently parsed `clippy` as a toolchain name and failed every run.
      - name: Show toolchain
        run: rustc --version && cargo --version && cargo clippy --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      # The steps below mirror the cargo-based release gates in
      # config/release.toml. Keep them in step: a release is gated on those
      # commands, so CI passing while a gate would fail is a false green.
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Runs again with features off: --all-features cannot see cfg-gated code
      # that only compiles when a feature is absent. A mis-gated re-export got
      # through exactly that blind spot once already.
      - name: Clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Doc coverage
        run: RUSTFLAGS='-D missing-docs' cargo check --workspace --lib

      # Audio-device-dependent smoke tests (signal-hardware-cpal)
      # self-skip when no output device is present, so no gating is needed.
      - name: Test
        run: cargo test --workspace

      # Not mirrored here: the `validate` and `docs` release gates run through
      # effigy, which is not installed on the runner. Their cargo-backed parts
      # (fmt, doc coverage, compile) are covered above; the northstar docs
      # checks remain local-only.
